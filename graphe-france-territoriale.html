<style>
  :root{
    --ink:#0f2b28;

    --paper-raised:#ffffff;
    --teal:#1f6f6b;
    --teal-deep:#123f3d;
    --line:#d9d4c4;
    --structure:#1f6f6b;
    --ressource:#c1663c;
    --guide:#a98f4b;
    --thematique:#4a5a7a;

  *{box-sizing:border-box;}
  html,body{

    background:var(--paper); color:var(--ink);
    font-family: 'Iowan Old Style', 'Georgia', serif;
    overflow:hidden;
  }
  .topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:baseline; justify-content:space-between;
    padding:22px 28px 14px 28px; z-index:10; pointer-events:none;
  }
  .topbar > *{ pointer-events:auto; }
  h1{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight:800; font-size:15px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--teal-deep); margin:0;
  }
  h1 span{
    display:block; font-family: 'Iowan Old Style', Georgia, serif;
    font-weight:400; text-transform:none; letter-spacing:0;
    font-size:26px; color:var(--ink); margin-top:4px;
  }
  .meta{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    color:#6b6455; text-align:right; line-height:1.6;
  }
  #graph{ width:100vw; height:100vh; display:block; }
  .link{ stroke:#b9b19a; stroke-opacity:0.35; }
  .link.dim{ stroke-opacity:0.04; }
  .node circle{ stroke:var(--paper); stroke-width:1.5px; cursor:pointer; }
  .node.dim{ opacity:0.12; }
  .node.hidden{ display:none; }
  .node text{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:9.5px; fill:var(--ink); pointer-events:none;
  }
  .node.dim text{ opacity:0; }
  .node.minor text{ opacity:0; }
  .node.minor:hover text{ opacity:1; }

  .legend{
    position:absolute; left:28px; bottom:26px;
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:11.5px;
    background:var(--paper-raised); border:1px solid var(--line);
    padding:14px 18px; z-index:10; box-shadow: 0 1px 0 var(--line);
  }
  .legend-title{
    font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    color:#8a8264; margin-bottom:9px; font-weight:700;
  }
  .legend-row{
    display:flex; align-items:center; gap:9px; margin:6px 0;
    cursor:pointer; user-select:none;
  }
  .legend-row.off{ opacity:0.35; }
  .legend-row .count{ color:#8a8264; font-size:10.5px; margin-left:auto; padding-left:14px; }
  .swatch{ width:10px; height:10px; border-radius:50%; flex:none; }

  .search-wrap{ position:absolute; top:22px; right:28px; z-index:10; }
  #search{
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:12.5px;
    border:1px solid var(--line); background:var(--paper-raised);
    padding:8px 12px; width:230px; color:var(--ink); outline:none;
  }
  #search:focus{ border-color:var(--teal); }

  .panel{
    position:absolute; top:0; right:-360px; width:340px; height:100vh;
    background:var(--paper-raised); border-left:1px solid var(--line);
    padding:80px 26px 26px 26px;
    transition: right 0.35s cubic-bezier(.4,0,.2,1);
    z-index:20; overflow-y:auto;
  }
  .panel.open{ right:0; }
  .panel-eyebrow{
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:10px;
    letter-spacing:0.12em; text-transform:uppercase; font-weight:700;
  }
  .panel-eyebrow.structure{ color:var(--structure); }
  .panel-eyebrow.ressource{ color:var(--ressource); }
  .panel-eyebrow.guide{ color:var(--guide); }
  .panel-eyebrow.thematique{ color:var(--thematique); }
  .panel h2{ font-size:22px; margin:8px 0 6px 0; line-height:1.2; }
  .panel .sub{
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:12px;
    color:#6b6455; margin-bottom:10px;
  }
  .panel .sub a{ color:var(--teal); }
  .panel-section-title{
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:10px;
    letter-spacing:0.1em; text-transform:uppercase; color:#8a8264;
    margin:20px 0 8px 0; font-weight:700;
  }
  .panel ul{ list-style:none; padding:0; margin:0; }
  .panel li{
    padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px;
    cursor:pointer; display:flex; align-items:center; gap:8px;
  }
  .panel li:hover{ color:var(--teal); }
  .panel li .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .close-btn{
    position:absolute; top:26px; right:26px;
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:11px;
    letter-spacing:0.08em; text-transform:uppercase;
    background:none; border:1px solid var(--line); padding:6px 12px;
    cursor:pointer; color:var(--ink);
  }
  .close-btn:hover{ border-color:var(--teal); color:var(--teal); }

  .hint{
    position:absolute; bottom:26px; right:28px;
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:11px;
    color:#8a8264; z-index:10; text-align:right; line-height:1.6;
  }
</style>
</head>

const nodes = GRAPH_DATA.nodes;
const links = GRAPH_DATA.links;

const typeColor = { structure: "#1f6f6b", ressource: "#c1663c", guide: "#a98f4b", thematique: "#4a5a7a" };
const typeLabel = { structure: "Structure", ressource: "Ressource", guide: "Guide", thematique: "Thématique" };
const typeOrder = ["structure", "ressource", "guide", "thematique"];

document.getElementById("statsLine").textContent =
  `${nodes.length} fiches · ${links.length} liens`;

// --- legend with counts + toggles ---
const activeTypes = new Set(typeOrder);
const legendEl = document.getElementById("legend");
typeOrder.forEach(t => {
  const count = nodes.filter(n => n.type === t).length;
  const row = document.createElement("div");
  row.className = "legend-row";
  row.dataset.type = t;
  row.innerHTML = `<span class="swatch" style="background:${typeColor[t]}"></span>${typeLabel[t]}<span class="count">${count}</span>`;
  row.addEventListener("click", () => toggleType(t));
  legendEl.appendChild(row);
});

function toggleType(t) {
  if (activeTypes.has(t)) activeTypes.delete(t); else activeTypes.add(t);
  document.querySelector(`.legend-row[data-type="${t}"]`).classList.toggle("off", !activeTypes.has(t));
  applyTypeFilter();
}

function applyTypeFilter() {
  node.classed("hidden", d => !activeTypes.has(d.type));
  link.classed("hidden", l => {
    const s = l.source.id || l.source, t = l.target.id || l.target;
    const sn = nodeById[s], tn = nodeById[t];
    return !activeTypes.has(sn.type) || !activeTypes.has(tn.type);
  });
}

const nodeById = {};
nodes.forEach(n => nodeById[n.id] = n);

const svg = d3.select("#graph");
const width = window.innerWidth, height = window.innerHeight;
svg.attr("viewBox", [0, 0, width, height]);
const container = svg.append("g");

svg.call(d3.zoom().scaleExtent([0.15, 4]).on("zoom", (event) => {
  container.attr("transform", event.transform);
}));

const degree = {};
links.forEach(l => {
  degree[l.source] = (degree[l.source] || 0) + 1;
  degree[l.target] = (degree[l.target] || 0) + 1;
});

const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(l => {
    const s = nodeById[l.source.id || l.source], t = nodeById[l.target.id || l.target];
    return (s.type === "thematique" || t.type === "thematique") ? 130 : 55;
  }).strength(0.35))
  .force("charge", d3.forceManyBody().strength(d => d.type === "thematique" ? -900 : -140))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(d => 5 + Math.min(degree[d.id] || 1, 25) * 1.6));

const link = container.append("g")
  .selectAll("line").data(links).join("line")
  .attr("class", "link").attr("stroke-width", 1);

const node = container.append("g")
  .selectAll("g").data(nodes).join("g")
  .attr("class", d => "node" + ((degree[d.id] || 0) <= 1 && d.type !== "thematique" ? " minor" : ""))
  .call(drag(simulation))
  .on("click", (event, d) => showPanel(d));

node.append("circle")
  .attr("r", d => d.type === "thematique" ? 10 + Math.min(degree[d.id] || 1, 40) * 0.9
                 : 4 + Math.min(degree[d.id] || 1, 20) * 1.3)
  .attr("fill", d => typeColor[d.type]);

node.append("text")
  .attr("x", d => 8 + (d.type === "thematique" ? 10 + Math.min(degree[d.id] || 1, 40) * 0.9 : 4 + Math.min(degree[d.id] || 1, 20) * 1.3))
  .attr("y", 4)
  .text(d => d.id);

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

function drag(sim) {
  function dragstarted(event, d) {
    if (!event.active) sim.alphaTarget(0.2).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
  function dragended(event, d) {
    if (!event.active) sim.alphaTarget(0);
    d.fx = null; d.fy = null;
  }
  return d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended);
}

function neighborsOf(id) {
  const set = new Set([id]);
  links.forEach(l => {
    const s = l.source.id || l.source, t = l.target.id || l.target;
    if (s === id) set.add(t);
    if (t === id) set.add(s);
  });
  return set;
}

function showPanel(d) {
  const neigh = neighborsOf(d.id);
  node.classed("dim", n => !neigh.has(n.id));
  link.classed("dim", l => {
    const s = l.source.id || l.source, t = l.target.id || l.target;
    return s !== d.id && t !== d.id;
  });

  const related = nodes.filter(n => neigh.has(n.id) && n.id !== d.id)
    .sort((a, b) => a.type.localeCompare(b.type) || a.id.localeCompare(b.id));

  document.getElementById("panelType").textContent = typeLabel[d.type];
  document.getElementById("panelType").className = "panel-eyebrow " + d.type;
  document.getElementById("panelTitle").textContent = d.id;
  document.getElementById("panelSub").innerHTML = d.url
    ? `<a href="${d.url}" target="_blank" rel="noopener">${d.url}</a>` : "";

  let html = `<div class="panel-section-title">${related.length} fiche(s) liée(s)</div><ul>`;
  related.forEach(r => {
    html += `<li onclick="jumpTo('${r.id.replace(/'/g, "\\'")}')"><span class="dot" style="background:${typeColor[r.type]}"></span>${r.id}</li>`;
  });
  html += "</ul>";
  document.getElementById("panelBody").innerHTML = html;
  document.getElementById("panel").classList.add("open");
}

function jumpTo(id) {
  const d = nodeById[id];
  if (d) showPanel(d);
}

document.getElementById("closePanel").addEventListener("click", () => {
  document.getElementById("panel").classList.remove("open");
  node.classed("dim", false);
  link.classed("dim", false);
});

document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { node.classed("dim", false); link.classed("dim", false); return; }
  node.classed("dim", d => !d.id.toLowerCase().includes(q));
  link.classed("dim", true);
});
</script>

</body>
</html>
